<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BeStreak</title>
 
<!-- PWA: ícono y metadatos para "Agregar a inicio" -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeStreak">
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_aW1tZW5zZS16ZWJyYS02MzM4LmNsZXJrLmFjY291bnRzLmRldiQ"
  src="https://immense-zebra-6338.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript"
></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { fail: '#E11D2A' }
      }
    }
  }
</script>
<style>
  html, body { height: 100%; }
  body { background:#fff; color:#000; font-family:'Inter',system-ui,sans-serif; }
  .safe-top { padding-top: env(safe-area-inset-top, 0px); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .screen { display:none; }
  .screen.active { display:flex; }
  video, canvas { transform: scaleX(-1); } /* espejo frontal */
  .shutter-ring { box-shadow: 0 0 0 4px #000, 0 0 0 8px #fff, 0 0 0 9px #000; }
  ::selection { background:#000; color:#fff; }
  .blur-locked { filter: blur(22px) brightness(0.6); }
</style>
</head>
<body class="min-h-screen w-full overflow-x-hidden">
 
<!-- ============ PANTALLA: SPLASH / CARGA ============ -->
<div id="screen-splash" class="screen active fixed inset-0 z-50 bg-black flex-col items-center justify-center gap-4">
  <h1 class="text-white text-4xl font-black tracking-tight">BeStreak</h1>
  <p class="text-white/50 text-sm">cargando…</p>
</div>
 
<!-- ============ PANTALLA: LOGIN (magic link) ============ -->
<div id="screen-login" class="screen min-h-screen w-full flex-col items-center justify-center px-6 gap-8 safe-top safe-bottom">
  <div class="text-center">
    <h1 class="text-5xl font-black tracking-tight mb-2">BeStreak</h1>
    <p class="text-black/60 text-sm">Una foto al día. Ninguna excusa.</p>
  </div>
 
  <button id="btn-open-login"
    class="w-full max-w-xs bg-black text-white font-bold py-3 active:scale-[0.98] transition-transform">
    Iniciar sesión / registrarme
  </button>
 
  <p id="login-msg" class="text-sm text-center max-w-xs"></p>
</div>
 
<!-- ============ PANTALLA: ONBOARDING (username + grupo) ============ -->
<div id="screen-onboarding" class="screen min-h-screen w-full flex-col items-center justify-center px-6 gap-6 safe-top safe-bottom">
  <h2 class="text-3xl font-black">Casi listo</h2>
 
  <input id="input-username" type="text" required maxlength="20" placeholder="tu nombre de usuario"
    class="w-full max-w-xs border-2 border-black px-4 py-3 outline-none" />
 
  <div class="w-full max-w-xs flex flex-col gap-3">
    <button id="btn-tab-join" class="text-sm font-bold underline underline-offset-4">Unirme con un código</button>
    <div id="join-box" class="flex flex-col gap-3">
      <input id="input-code" type="text" maxlength="8" placeholder="CÓDIGO DE GRUPO"
        class="w-full border-2 border-black px-4 py-3 uppercase tracking-widest outline-none" />
      <button id="btn-join-group" class="w-full bg-black text-white font-bold py-3">Unirme al grupo</button>
    </div>
 
    <div class="flex items-center gap-3 my-1">
      <div class="h-px bg-black/20 flex-1"></div>
      <span class="text-xs text-black/40">o</span>
      <div class="h-px bg-black/20 flex-1"></div>
    </div>
 
    <button id="btn-tab-create" class="text-sm font-bold underline underline-offset-4">Crear un grupo nuevo</button>
    <div id="create-box" class="hidden flex-col gap-3">
      <input id="input-group-name" type="text" placeholder="nombre del grupo"
        class="w-full border-2 border-black px-4 py-3 outline-none" />
      <input id="input-punishment" type="text" placeholder="castigo si rompes la racha"
        class="w-full border-2 border-black px-4 py-3 outline-none" />
      <button id="btn-create-group" class="w-full bg-black text-white font-bold py-3">Crear grupo</button>
    </div>
  </div>
 
  <p id="onboarding-msg" class="text-sm text-center max-w-xs"></p>
</div>
 
<!-- ============ PANTALLA: FEED PRINCIPAL ============ -->
<div id="screen-feed" class="screen min-h-screen w-full flex-col safe-top safe-bottom">
  <header class="flex items-center justify-between px-5 pt-4 pb-2">
    <div>
      <p id="feed-group-name" class="font-black text-xl leading-none">—</p>
      <p id="feed-punishment" class="text-xs text-black/50 mt-1">—</p>
    </div>
    <button id="btn-logout" class="text-xs font-bold text-black/40 underline">salir</button>
  </header>
 
  <div class="flex items-center justify-center gap-2 px-5 py-3 border-b-2 border-black">
    <span class="text-2xl">🔥</span>
    <span id="my-streak" class="text-3xl font-black">0</span>
    <span class="text-sm text-black/50">días seguidos</span>
  </div>
 
  <!-- Bloqueado hasta subir foto -->
  <div id="feed-locked" class="flex-1 flex flex-col items-center justify-center gap-5 px-6 text-center">
    <div class="w-24 h-24 border-2 border-black rounded-full flex items-center justify-center">
      <span class="text-4xl">📷</span>
    </div>
    <p class="font-bold text-lg">Sube tu foto para desbloquear</p>
    <p class="text-black/50 text-sm max-w-[240px]">Aún no ves las fotos de tu grupo hoy.</p>
    <button id="btn-go-capture" class="bg-black text-white font-bold px-8 py-3">Abrir cámara</button>
  </div>
 
  <!-- Feed desbloqueado -->
  <div id="feed-unlocked" class="hidden flex-1 flex-col overflow-y-auto px-4 pb-6 gap-4">
    <div id="feed-list" class="flex flex-col gap-4 pt-4"></div>
  </div>
</div>
 
<!-- ============ PANTALLA: CAPTURA ============ -->
<div id="screen-capture" class="screen fixed inset-0 z-40 bg-black flex-col items-center justify-center safe-top safe-bottom">
  <button id="btn-close-capture" class="absolute top-4 left-4 text-white text-2xl z-10 safe-top">✕</button>
 
  <div id="capture-live" class="w-full h-full flex-col items-center justify-center relative">
    <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
    <button id="btn-shutter" aria-label="Tomar foto"
      class="absolute bottom-10 w-20 h-20 rounded-full bg-white shutter-ring"></button>
  </div>
 
  <div id="capture-preview" class="hidden w-full h-full flex-col items-center justify-center relative">
    <canvas id="canvas" class="w-full h-full object-cover"></canvas>
    <div class="absolute bottom-10 flex gap-6 items-center">
      <button id="btn-retake" class="text-white font-bold border-2 border-white px-6 py-3">Repetir</button>
      <button id="btn-send" class="bg-white text-black font-bold px-8 py-3">Enviar</button>
    </div>
  </div>
 
  <div id="capture-error" class="hidden flex-col items-center justify-center gap-4 px-8 text-center text-white">
    <p class="text-5xl">🚫</p>
    <p class="font-bold text-lg">No pudimos acceder a tu cámara</p>
    <p class="text-white/60 text-sm">Revisa los permisos de cámara en tu navegador y vuelve a intentar.</p>
    <button id="btn-retry-camera" class="bg-white text-black font-bold px-6 py-3">Reintentar</button>
  </div>
 
  <div id="capture-uploading" class="hidden flex-col items-center justify-center gap-3 text-white">
    <p class="font-bold">Subiendo…</p>
  </div>
</div>
 
<script src="config.js"></script>
<script src="main.js"></script>
</body>
</html>
